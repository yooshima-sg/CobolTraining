; COBOL実習環境のODBCデータソース定義（システムDSN）
; Dockerfile.devenvironment でコンテナの /etc/odbc.ini にコピーされる。
; 埋込みSQL(esqlOC)のプログラムからは、接続文字列に "@KENSHUDB" を指定して接続する。
[KENSHUDB]
Description  = COBOL training database (PostgreSQL)
Driver       = PostgreSQL Unicode
Servername   = db
Port         = 5432
Database     = postgres
Username     = postgres
Password     = postgres
ConnSettings = SET CLIENT_ENCODING to 'SJIS'
